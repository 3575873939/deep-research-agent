<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Research Agent</title>
<style>
  :root {
    --bg: #0b0f19; --bg-raised: #111827; --bg-hover: #1a2235;
    --border: #1f2937; --border-strong: #374151;
    --text: #f3f4f6; --text-secondary: #9ca3af; --text-muted: #6b7280;
    --accent: #d97706; --accent-glow: rgba(217,119,6,.2); --accent-dim: rgba(217,119,6,.12);
    --blue: #3b82f6; --cyan: #06b6d4; --green: #22c55e; --yellow: #eab308; --red: #ef4444;
    --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }

  /* ===== HERO ===== */
  .hero { text-align: center; margin-bottom: 36px; }
  .hero h1 { font-family: var(--serif); font-size: 32px; font-weight: 400; letter-spacing: -0.5px; margin-bottom: 8px; }
  .hero h1 span { color: var(--accent); font-weight: 600; }
  .hero p { font-size: 13px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .hero .stats-bar {
    display: inline-flex; gap: 24px; margin-top: 18px;
    padding: 8px 20px; border: 1px solid var(--border); border-radius: 20px;
    font-size: 12px; color: var(--text-muted);
  }
  .hero .stats-bar b { color: var(--text-secondary); font-weight: 600; }

  /* ===== MODEL SELECTOR ===== */
  .model-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    font-size: 13px; color: var(--text-muted);
  }
  .model-bar select {
    background: var(--bg-raised); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 6px 12px; border-radius: 6px;
    font-size: 13px; outline: none; cursor: pointer;
    font-family: var(--mono);
  }
  .model-bar select:focus { border-color: var(--accent); }
  .model-bar .chip {
    padding: 3px 10px; border-radius: 10px; font-size: 11px;
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid rgba(217,119,6,.25);
  }
  .model-bar .hint { font-size: 11px; color: var(--text-muted); }

  /* 自定义供应商 */
  .custom-row { display: flex; gap: 6px; }
  .custom-row input {
    background: var(--bg-raised); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 8px;
    font-size: 13.5px; outline: none; flex: 1;
  }
  .custom-row input:focus { border-color: var(--accent); }

  /* ===== INPUT ===== */
  .input-wrap {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px; display: flex; gap: 6px;
    margin-bottom: 16px; transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .input-wrap input { flex: 1; background: transparent; border: none; color: var(--text); padding: 12px 14px; font-size: 15px; outline: none; }
  .input-wrap input::placeholder { color: var(--text-muted); }
  .input-wrap button {
    background: var(--accent); color: #fff; border: none; padding: 0 24px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: filter .2s, transform .1s; white-space: nowrap;
  }
  .input-wrap button:hover { filter: brightness(1.1); }
  .input-wrap button:active { transform: scale(.97); }
  .input-wrap button:disabled { opacity: .45; cursor: default; transform: none; }

  /* ===== PRESETS ===== */
  .presets { margin-bottom: 28px; }
  .presets-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 8px; }
  .preset-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .preset-tags button {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); padding: 5px 12px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; transition: all .2s;
  }
  .preset-tags button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ===== PROGRESS ===== */
  .progress-track { display: flex; gap: 4px; margin-bottom: 28px; opacity: 0; transform: translateY(-8px); transition: opacity .4s, transform .4s; }
  .progress-track.visible { opacity: 1; transform: translateY(0); }
  .progress-track .step { flex: 1; height: 3px; border-radius: 2px; background: var(--border); position: relative; overflow: hidden; }
  .progress-track .step.active { background: var(--accent); }
  .progress-track .step.done { background: var(--green); }
  .progress-track .step .label { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
  .progress-track .step.active .label { color: var(--accent); }
  .progress-track .step.done .label { color: var(--green); }

  /* ===== STATUS ===== */
  .status-bar { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; min-height: 22px; display: flex; align-items: center; gap: 10px; font-family: var(--mono); }
  .status-bar .typing::after { content: "▌"; animation: blink 1s step-end infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== CARDS ===== */
  .card {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px;
    padding: 0; margin-bottom: 16px; overflow: hidden;
    opacity: 0; transform: translateY(16px); transition: opacity .45s, transform .45s, border-color .3s;
  }
  .card.visible { opacity: 1; transform: translateY(0); }
  .card:hover { border-color: var(--border-strong); }
  .card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); font-weight: 600; }
  .card-header .icon { width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .card-body { padding: 14px 18px 18px; }
  .card[data-type="plan"] { border-left: 3px solid var(--blue); }
  .card[data-type="tool"] { border-left: 3px solid var(--cyan); }
  .card[data-type="verify"] { border-left: 3px solid var(--green); }
  .card[data-type="report"] { border-left: 3px solid var(--text); }
  .card[data-type="error"] { border-left: 3px solid var(--red); }
  .card[data-type="plan"] .card-header .icon { background: rgba(59,130,246,.12); color: var(--blue); }
  .card[data-type="tool"] .card-header .icon { background: rgba(6,182,212,.12); color: var(--cyan); }
  .card[data-type="verify"] .card-header .icon { background: rgba(34,197,94,.12); color: var(--green); }
  .card[data-type="report"] .card-header .icon { background: rgba(255,255,255,.08); color: var(--text-secondary); }
  .card[data-type="task"] { border-left: 3px solid var(--yellow); }
  .card[data-type="task"] .card-header .icon { background: rgba(234,179,8,.12); color: var(--yellow); }

  /* task rows */
  .task-row {
    position: relative;
    padding: 14px 0 14px 16px;
    border-bottom: 1px solid var(--border);
    transition: background .2s;
  }
  .task-row:last-child { border-bottom: none; }
  .task-row::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 2px; background: transparent;
  }
  .task-row[data-st="in_progress"]::before { background: var(--accent); }
  .task-row[data-st="completed"]::before { background: var(--green); }
  .task-row[data-st="failed"]::before { background: var(--red); }
  .task-row[data-st="skipped"]::before { background: var(--border-strong); }
  .task-row:hover { background: var(--bg-hover); }
  .task-row[data-st="completed"] { background: rgba(34,197,94,.03); }
  .task-head { display: flex; align-items: center; gap: 10px; }
  .task-no {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--text-muted);
    transition: all .2s;
  }
  .task-row[data-st="in_progress"] .task-no { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .task-row[data-st="completed"] .task-no { border-color: rgba(34,197,94,.5); color: var(--green); background: rgba(34,197,94,.08); }
  .task-row[data-st="failed"] .task-no { border-color: rgba(239,68,68,.5); color: var(--red); background: rgba(239,68,68,.08); }
  .task-title { font-size: 14px; color: var(--text); font-weight: 600; flex: 1; }
  .task-status {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    padding: 3px 9px 3px 6px; border-radius: 10px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid transparent;
  }
  .task-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .task-status[data-st="completed"] { background: rgba(34,197,94,.12); color: var(--green); border-color: rgba(34,197,94,.25); }
  .task-status[data-st="in_progress"] { background: rgba(217,119,6,.12); color: var(--accent); border-color: rgba(217,119,6,.25); }
  .task-status[data-st="failed"] { background: rgba(239,68,68,.12); color: var(--red); border-color: rgba(239,68,68,.25); }
  .task-status[data-st="skipped"] { background: rgba(148,163,184,.12); color: var(--text-muted); border-color: rgba(148,163,184,.25); }
  .task-status[data-st="in_progress"]::before { animation: taskPulse 1s infinite; }
  .task-intent { font-size: 12px; color: var(--text-muted); margin: 4px 0 8px 34px; line-height: 1.5; }
  .task-body { margin-left: 34px; font-size: 13px; color: var(--text-secondary); }
  .task-summary { line-height: 1.7; }
  .task-summary h3 { margin: 10px 0 6px; }
  .task-cites { margin-top: 8px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .task-cites .cite-btn { margin-left: 2px; }
  .task-sources { margin-top: 6px; font-size: 11px; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px; }
  .task-src { font-family: var(--mono); word-break: break-all; }
  .task-src a { color: var(--accent); text-decoration: none; transition: color .15s; }
  .task-src a:hover { color: #f59e0b; text-decoration: underline; }
  /* 任务内进度 dot（脉冲） */
  .task-body .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-right: 8px;
    animation: taskPulse 1s infinite;
  }
  @keyframes taskPulse { 50% { opacity: .3; } }
  /* 卡片头进度计数 */
  .task-progress { margin-left: auto; font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .task-progress b { color: var(--green); }

  /* plan */
  .subq-list { display: flex; flex-direction: column; }
  .subq-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-secondary); }
  .subq-item:last-child { border-bottom: none; }
  .subq-num { width: 24px; height: 24px; border-radius: 50%; background: var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; margin-top: 1px; }
  .subq-item:hover .subq-num { background: var(--accent); color: #fff; }

  /* tool */
  .tool-log { font-family: var(--mono); font-size: 12px; }
  .tool-entry { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-muted); }
  .tool-entry:last-child { border-bottom: none; }
  .tool-entry .badge { padding: 1px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .tool-entry .badge.ok { background: rgba(34,197,94,.15); color: var(--green); }

  /* verify */
  .verify-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .verify-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; transition: border-color .2s; }
  .verify-cell:hover { border-color: var(--border-strong); }
  .verify-cell .num { font-size: 28px; font-weight: 700; line-height: 1; font-family: var(--serif); }
  .verify-cell .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-top: 6px; }
  .verify-cell.supported .num { color: var(--green); }
  .verify-cell.partial .num { color: var(--yellow); }
  .verify-cell.unsupported .num { color: var(--red); }
  .verify-bars { display: flex; gap: 3px; height: 4px; margin-top: 12px; border-radius: 2px; overflow: hidden; }
  .verify-bars .bar { transition: width .6s ease; }

  /* report */
  .report-body { font-size: 15px; line-height: 1.85; color: var(--text-secondary); }
  .report-body h1, .report-body h2, .report-body h3 { font-family: var(--serif); color: var(--text); margin: 24px 0 12px; font-weight: 600; line-height: 1.3; }
  .report-body h1 { font-size: 22px; } .report-body h2 { font-size: 18px; } .report-body h3 { font-size: 15px; }
  .report-body p { margin-bottom: 12px; }
  .report-body ul, .report-body ol { margin: 0 0 12px 20px; }
  .report-body li { margin-bottom: 4px; }
  .cite-btn { display: inline-block; background: var(--accent-dim); border: 1px solid rgba(217,119,6,.35); color: var(--accent); padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; vertical-align: middle; margin: 0 1px; transition: background .15s, border-color .15s; }
  .cite-btn:hover { background: rgba(217,119,6,.25); border-color: var(--accent); }
  .report-meta { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  /* ===== HISTORY ===== */
  .history-wrap { margin-top: 36px; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .history-header h2 { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .history-header button {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .history-header button:hover { border-color: var(--accent); color: var(--accent); }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; cursor: pointer; transition: border-color .2s, background .2s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .history-item:hover { border-color: var(--accent); background: var(--bg-hover); }
  .history-item .q { font-size: 13.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
  .history-item .meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .history-empty { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; }

  /* ===== MODAL ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: 12px; max-width: 680px; width: 90%; max-height: 78vh; overflow: auto; padding: 0; transform: scale(.96); transition: transform .25s; }
  .modal-overlay.open .modal-box { transform: scale(1); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .modal-head button { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .modal-head button:hover { color: var(--text); border-color: var(--text-secondary); }
  .modal-body { padding: 16px 20px 20px; }
  .modal-url { font-size: 12px; color: var(--accent); word-break: break-all; margin-bottom: 10px; }
  .modal-body pre { background: var(--bg); padding: 14px; border-radius: 8px; font-size: 12.5px; white-space: pre-wrap; max-height: 340px; overflow: auto; border: 1px solid var(--border); color: var(--text-secondary); line-height: 1.6; }

  /* ===== EMPTY ===== */
  .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 14px; }
  .empty .big { font-size: 48px; margin-bottom: 12px; opacity: .25; }

  @media (max-width: 560px) {
    .hero h1 { font-size: 24px; }
    .verify-grid { grid-template-columns: 1fr; }
    .input-wrap { flex-direction: column; }
    .input-wrap button { padding: 12px; }
    .model-bar { flex-wrap: wrap; }
  }

  /* ===== HUMAN REVIEW ===== */
  .card[data-type="interrupt"] { border-left: 3px solid var(--accent); }
  .card[data-type="interrupt"] .card-header .icon { background: var(--accent-dim); color: var(--accent); }
  .interrupt-msg { font-size: 14px; color: var(--text); margin-bottom: 14px; }
  .risky-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .risky-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px;
    color: var(--text-secondary); padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; line-height: 1.5; }
  .risky-item .cite { font-family: var(--mono); font-size: 11px; color: var(--blue); flex-shrink: 0; }
  .risky-item .verdict { flex-shrink: 0; font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: rgba(239,68,68,.15); color: var(--red); text-transform: uppercase; }
  .interrupt-actions { display: flex; gap: 10px; }
  .interrupt-actions button { padding: 9px 18px; border-radius: 8px; font-size: 13.5px;
    font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: filter .2s; }
  .interrupt-actions button:hover { filter: brightness(1.15); }
  .interrupt-actions button:disabled { opacity: .5; cursor: default; }
  .interrupt-actions .accept { background: var(--green); color: #06210f; }
  .interrupt-actions .redo { background: transparent; color: var(--text-secondary);
    border-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>Deep <span>Research</span> Agent</h1>
    <p>自主调研 · 检索取证 · 引用核查 · 机器可验证</p>
    <div class="stats-bar">
      <span>全量 30 题 · <b>幻觉率 0%</b></span>
      <span>引用可验证率 <b>87.8%</b></span>
      <span>检索命中率 <b>56.7%</b></span>
    </div>
  </div>

  <!-- ===== MODEL / PROVIDER SELECTOR ===== -->
  <div class="model-bar" id="providerBar">
    <label>供应商</label>
    <select id="providerSelect" onchange="applyProvider()">
      <option value="">环境默认（DeepSeek）</option>
    </select>
  </div>
  <div class="input-wrap" id="customWrap" style="display:none">
    <div class="custom-row">
      <input id="customBase" placeholder="base_url（如 https://api.openai.com/v1）" />
    </div>
    <div class="custom-row">
      <input id="customKey" placeholder="api_key" type="password" />
      <input id="customModel" placeholder="模型名（如 gpt-4o）" />
    </div>
  </div>

  <div class="input-wrap" id="inputWrap">
    <input id="q" placeholder="输入研究问题，如：LangGraph 的 conditional edges 与 Command 路由怎么配合？"
           onkeydown="if(event.key==='Enter') start()" />
    <button id="btn" onclick="start()">开始调研</button>
  </div>

  <div class="presets">
    <div class="presets-label">快速提问</div>
    <div class="preset-tags" id="presets"></div>
  </div>

  <div class="progress-track" id="progress">
    <div class="step" id="p-plan"><div class="label">拆解</div></div>
    <div class="step" id="p-tool"><div class="label">检索</div></div>
    <div class="step" id="p-token"><div class="label">综合</div></div>
    <div class="step" id="p-verify"><div class="label">核查</div></div>
  </div>

  <div class="status-bar" id="status"></div>

  <div id="output"></div>

  <div class="empty" id="empty">
    <div class="big">&#x1F4DA;</div>
    <p>输入问题，开始端到端的研究调研</p>
  </div>

  <div class="history-wrap" id="historyWrap" style="display:none">
    <div class="history-header">
      <h2>运行记录</h2>
      <button onclick="loadHistory()">刷新</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">引用原文</h3>
      <button onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-body">
      <div class="modal-url" id="modalUrl"></div>
      <pre id="modalBody"></pre>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ===== PRESETS ===== */
const PRESETS = [
  { q: "LangGraph 的 conditional edges 与 Command 路由怎么配合？", tag: "技术" },
  { q: "BM25 与向量检索的融合策略（RRF）有什么 trade-off？", tag: "技术" },
  { q: "MCP（Model Context Protocol）与 function calling 有什么本质区别？", tag: "技术" },
  { q: "Chroma vs Milvus vs Weaviate，生产环境怎么选？", tag: "对比" },
  { q: "DeepSeek V4.1 Flash 与 V4 Pro 的适用场景差异？", tag: "对比" },
  { q: "2026 年主流 LLM API 免费额度对比", tag: "时效" },
  { q: "Python 3.13 的 free-threading 模式对 AI Agent 的影响", tag: "技术" },
  { q: "LangGraph 的 interrupt / resume 机制与 checkpoint 持久化", tag: "技术" },
];

function renderPresets() {
  const el = $('presets');
  el.innerHTML = PRESETS.map(p =>
    `<button onclick="setQuestion('${esc(p.q)}')">${esc(p.tag)} · ${esc(p.q.slice(0,22))}${p.q.length>22?'...':''}</button>`
  ).join('');
}
function setQuestion(q) { $('q').value = q; $('q').focus(); }

/* ===== PROVIDERS ===== */
let currentProvider = null; // 当前选择的预设（含 base_url/models）

async function loadProviders() {
  try {
    const r = await fetch('/providers');
    const data = await r.json();
    const sel = $('providerSelect');
    sel.innerHTML = '<option value="">环境默认（DeepSeek）</option>' +
      data.providers.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    sel.value = '';
    currentProvider = null;
    $('customWrap').style.display = 'none';
  } catch (e) {
    $('providerSelect').innerHTML = '<option value="">环境默认（DeepSeek）</option>';
  }
}

function applyProvider() {
  const id = $('providerSelect').value;
  if (!id) {
    currentProvider = null;
    $('customWrap').style.display = 'none';
    return;
  }
  // 从已加载的预设里找（重新拉一次避免闭包）
  fetch('/providers').then(r => r.json()).then(data => {
    const p = data.providers.find(x => x.id === id);
    if (!p) return;
    currentProvider = p;
    // 显示 base_url 和 api_key 输入（预填 base_url）
    $('customWrap').style.display = 'block';
    $('customBase').value = p.base_url || '';
    $('customKey').value = '';
    $('customModel').placeholder = '模型名（如 ' + (p.models && p.models[0] || '') + '）';
  });
}

/* ===== HISTORY ===== */
async function loadHistory() {
  try {
    const r = await fetch('/traces');
    const traces = await r.json();
    const wrap = $('historyWrap');
    const list = $('historyList');
    if (!traces.length) {
      list.innerHTML = '<div class="history-empty">暂无运行记录</div>';
      wrap.style.display = 'block'; return;
    }
    wrap.style.display = 'block';
    list.innerHTML = traces.slice(-10).reverse().map(t => {
      const date = t.timestamp ? new Date(t.timestamp*1000).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
      return `<div class="history-item" onclick="setQuestion('${esc(t.question)}')">
        <div class="q">${esc(t.question)}</div>
        <div class="meta">${date} · ${(t.tokens||0).toLocaleString()} tokens</div>
      </div>`;
    }).join('');
  } catch (e) {
    $('historyWrap').style.display = 'none';
  }
}

/* ===== RUN ===== */
function setStatus(html) { $('status').innerHTML = '<span class="typing">' + html + '</span>'; }
function progressStep(id, state) { const el = $(id); el.classList.remove('active','done'); if(state) el.classList.add(state); }

function createCard(type, title, icon) {
  const el = document.createElement('div');
  el.className = 'card'; el.dataset.type = type;
  el.innerHTML = `<div class="card-header"><div class="icon">${icon}</div><span>${title}</span></div><div class="card-body" id="body-${type}"></div>`;
  $('output').appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  return el.querySelector('.card-body');
}

async function start() {
  const q = $('q').value.trim(); if (!q) return;
  $('btn').disabled = true; $('empty').style.display = 'none'; $('output').innerHTML = '';
  $('progress').classList.add('visible');
  ['p-plan','p-tool','p-token','p-verify'].forEach(id => progressStep(id,''));
  setStatus('初始化...');

  const model = $('customModel').value.trim() || undefined;
  const base_url = $('customBase').value.trim() || undefined;
  const api_key = $('customKey').value.trim() || undefined;

  try {
    const resp = await fetch('/research/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, model, base_url, api_key })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        handleEvent(block);
      }
    }
  } catch (e) {
    setStatus('');
    const body = createCard('error', '请求失败', '&#x26A0;');
    body.innerHTML = '<p style="color:var(--red);font-size:14px;">' + esc(e.message) + '</p>';
  } finally {
    $('btn').disabled = false;
    loadHistory();
  }
}

function handleEvent(block) {
  let event = '', data = '';
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data = line.slice(5).trim();
  }
  if (!event || !data) return;
  const d = JSON.parse(data);

  if (event === 'plan' && d.subquestions) {
    progressStep('p-plan','done'); progressStep('p-tool','active');
    setStatus('检索取证中（' + d.subquestions.length + ' 个子问题并行）');
    const body = createCard('plan','子问题拆解','&#x1F4CB;');
    body.innerHTML = '<div class="subq-list">' + d.subquestions.map((s,i) =>
      '<div class="subq-item"><div class="subq-num">'+(i+1)+'</div><div>'+esc(s)+'</div></div>'
    ).join('') + '</div>';
  } else if (event === 'tool_result') {
    let body = $('body-tool'); if (!body) body = createCard('tool','工具调用','&#x1F527;');
    const entry = document.createElement('div'); entry.className = 'tool-entry';
    entry.innerHTML = '<span class="badge ok">OK</span> findings '+d.findings_so_far+' · 工具调用 '+d.tool_calls+' 次';
    body.appendChild(entry); body.scrollTop = body.scrollHeight;
  } else if (event === 'task_status') {
    handleTaskStatus(d);
  } else if (event === 'token') {
    progressStep('p-tool','done'); progressStep('p-token','active'); setStatus('综合成稿中...');
  } else if (event === 'verify') {
    progressStep('p-token','done'); progressStep('p-verify','active'); setStatus('结论核查中...');
    const total = d.supported+d.partial+d.unsupported;
    const sp = total?(d.supported/total*100).toFixed(1):0;
    const pp = total?(d.partial/total*100).toFixed(1):0;
    const up = total?(d.unsupported/total*100).toFixed(1):0;
    const body = createCard('verify','结论核查','&#x1F50E;');
    body.innerHTML = `
      <div class="verify-grid">
        <div class="verify-cell supported"><div class="num">${d.supported}</div><div class="label">supported</div></div>
        <div class="verify-cell partial"><div class="num">${d.partial}</div><div class="label">partial</div></div>
        <div class="verify-cell unsupported"><div class="num">${d.unsupported}</div><div class="label">unsupported</div></div>
      </div>
      <div class="verify-bars">
        <div class="bar" style="width:${sp}%;background:var(--green)"></div>
        <div class="bar" style="width:${pp}%;background:var(--yellow)"></div>
        <div class="bar" style="width:${up}%;background:var(--red)"></div>
      </div>`;
  } else if (event === 'done') {
    if (d.paused) {           // 暂停待人工确认：报告在 resume 返回后再渲染
      setStatus('等待人工确认'); $('btn').disabled = false; return;
    }
    progressStep('p-verify','done'); setStatus('完成');
    if (d.report) {
      const body = createCard('report','研究报告','&#x1F4C4;');
      body.innerHTML = renderReport(d.report) + '<div class="report-meta">tokens: '+d.tokens.toLocaleString()+(d.budget_exhausted?' · 预算截断':'')+'</div>';
    }
  } else if (event === 'interrupt') {
    showInterruptCard(d);
  } else if (event === 'error') {
    setStatus('');
    const body = createCard('error','错误','&#x26A0;');
    body.innerHTML = '<p style="color:var(--red);font-size:14px;">'+esc(d.error||'unknown')+'</p>';
  }
}

/* ===== 人工确认（human-in-the-loop）===== */
function providerPayload(extra) {
  return Object.assign({}, extra, {
    model: $('customModel').value.trim() || undefined,
    base_url: $('customBase').value.trim() || undefined,
    api_key: $('customKey').value.trim() || undefined,
  });
}

function showInterruptCard(d) {
  setStatus('等待人工确认');
  const info = d.value || {};
  const body = createCard('interrupt','人工确认','&#x270B;');
  const claims = (info.risky_claims || []).map(c =>
    '<div class="risky-item">'
    + '<span class="verdict">' + esc(c.verdict || '') + '</span>'
    + '<span class="cite">' + (c.citation_id != null ? 'C' + c.citation_id : '无引用') + '</span>'
    + '<span>' + esc(c.claim || '') + '</span></div>').join('');
  body.innerHTML =
    '<p class="interrupt-msg">' + esc(info.message || '需要人工确认') + '</p>'
    + (claims ? '<div class="risky-list">' + claims + '</div>' : '')
    + '<div class="interrupt-actions">'
    + '<button class="accept" id="irAccept">接受当前报告</button>'
    + '<button class="redo" id="irRedo">打回重新调研</button></div>'
    + '<div id="irResult" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></div>';
  $('irAccept').onclick = () => sendResume(d.run_id, 'accept');
  $('irRedo').onclick = () => sendResume(d.run_id, 'redo');
}

async function sendResume(runId, action) {
  const out = $('irResult');
  if (out) out.textContent = action === 'redo' ? '已打回，重新调研中…' : '处理中…';
  const acceptBtn = $('irAccept'), redoBtn = $('irRedo');
  if (acceptBtn) acceptBtn.disabled = true;
  if (redoBtn) redoBtn.disabled = true;
  try {
    const resp = await fetch('/research/resume', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(providerPayload({ run_id: runId, action: action }))
    });
    const d = await resp.json();
    if (!d.ok) {
      if (out) out.innerHTML = '<span style="color:var(--red)">' + esc(d.error || '恢复失败') + '</span>';
      return;
    }
    if (out) out.remove();
    if (d.paused) { showInterruptCard({ run_id: d.run_id, value: d.interrupt }); return; }
    setStatus('完成'); progressStep('p-verify','done');
    if (d.report) {
      const body = createCard('report','研究报告','&#x1F4C4;');
      body.innerHTML = renderReport(d.report)
        + '<div class="report-meta">tokens: ' + (d.tokens || 0).toLocaleString()
        + ' · 人工决策: ' + esc(d.human_decision || '-') + '</div>';
    }
  } catch (e) {
    if (out) out.innerHTML = '<span style="color:var(--red)">' + esc(String(e)) + '</span>';
  }
}

/* 任务进度卡片：逐任务渲染 status/summary/sources */
function handleTaskStatus(d) {
  let list = $('taskList');
  if (!list) {
    const body = createCard('task','研究任务','&#x1F4DD;');
    body.innerHTML = '<div class="task-list" id="taskList"></div>';
    list = $('taskList');
    // 卡片头追加进度计数
    const header = body.closest('.card').querySelector('.card-header');
    const prog = document.createElement('span');
    prog.className = 'task-progress'; prog.id = 'taskProgress';
    prog.innerHTML = '0/0';
    header.appendChild(prog);
  }
  const id = d.task_id;
  let row = list.querySelector('[data-task="'+id+'"]');
  if (!row) {
    row = document.createElement('div');
    row.className = 'task-row'; row.dataset.task = id;
    row.innerHTML =
      '<div class="task-head"><span class="task-no">' + id + '</span>' +
      '<span class="task-title">' + esc(d.title || '任务'+id) + '</span>' +
      '<span class="task-status" data-st="'+ d.status +'">' + d.status + '</span></div>' +
      (d.intent ? '<div class="task-intent">' + esc(d.intent) + '</div>' : '') +
      '<div class="task-body"></div>';
    // 按 task_id 正序插入：插到第一个比它大的行之前
    let inserted = false;
    const rows = list.querySelectorAll('.task-row');
    for (const r of rows) {
      if (parseInt(r.dataset.task, 10) > id) {
        list.insertBefore(row, r);
        inserted = true;
        break;
      }
    }
    if (!inserted) list.appendChild(row);
  }
  row.dataset.st = d.status;   // 供 CSS 状态样式匹配
  const statusEl = row.querySelector('.task-status');
  if (statusEl) { statusEl.dataset.st = d.status; statusEl.textContent = d.status; }

  const body = row.querySelector('.task-body');
  if (d.status === 'in_progress') { body.innerHTML = '<span class="dot"></span> 调研中...'; }
  else if (d.status === 'completed') {
    const cites = (d.citation_ids||[]).map(c => '<span class="cite-btn" onclick="showCitation(' + c + ')">C' + c + '</span>').join(' ');
    const srcs = (d.sources||[]).map(s => '<div class="task-src"><a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s) + '</a></div>').join('');
    body.innerHTML =
      '<div class="task-summary">' + renderReport(d.summary||'') + '</div>' +
      (cites ? '<div class="task-cites">引用 ' + cites + '</div>' : '') +
      (srcs ? '<div class="task-sources">来源 ' + srcs + '</div>' : '');
  } else if (d.status === 'failed' || d.status === 'skipped') {
    body.innerHTML = '<div class="task-summary">' + esc(d.summary||'无可用信息') + '</div>';
  }

  // 刷新卡片头进度计数（completed 数量 / 总任务数）
  const prog = $('taskProgress');
  if (prog) {
    const rows = list.querySelectorAll('.task-row');
    const done = list.querySelectorAll('.task-row[data-st="completed"], .task-row[data-st="failed"], .task-row[data-st="skipped"]').length;
    prog.innerHTML = '<b>' + done + '</b>/' + rows.length + ' 已完成';
  }
}

function renderReport(md) {
  let html = esc(md);
  html = html.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>')
             .replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
             .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  html = html.replace(/\[cite:(\d+)\]/g,'<span class="cite-btn" onclick="showCitation($1)">C$1</span>');
  return '<div class="report-body">'+html+'</div>';
}
function showCitation(id) {
  fetch('/citations/'+id).then(r=>r.json()).then(c=>{
    if(!c.ok) return;
    $('modalTitle').textContent = c.title||'(无标题)';
    $('modalUrl').textContent = c.url;
    $('modalBody').textContent = c.snapshot;
    $('modal').classList.add('open');
  });
}
function closeModal() { $('modal').classList.remove('open'); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ===== INIT ===== */
renderPresets(); loadProviders(); loadHistory();
</script>
</body>
</html>
