[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Research Agent: LangGraph + MCP tools + hybrid RAG + verifiable citations"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2.2",
    "tenacity>=8.4",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 向量检索与 rerank 为可选：BM25-only 模式也能跑通全链路
vec = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
eval = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
