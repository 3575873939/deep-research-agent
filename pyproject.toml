[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Research Agent: LangGraph state machine + verifiable citations + hybrid RAG + MCP tool layer"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # 上界固定在 2.0：openai 3.x 是跨大版本（本地验证的是 1.x）
    "openai>=1.50,<2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2.2",
    "tenacity>=8.4",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 以下均为可选增强：任一缺失都会自动降级，主链路始终可跑
# 向量召回（缺失 → 退化为 BM25-only）
vec = [
    "sentence-transformers>=3.0",
]
# MCP 工具层（缺失 → 仅用内置 search/fetch）
# 上界固定在 2.0：mcp 2.x 是大版本升级，client API 有变动；
# 本项目适配并验证的是 1.x，不设上界会让 CI/用户装到未验证的 2.x
mcp = [
    "mcp>=1.0,<2.0",
]
eval = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
